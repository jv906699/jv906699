<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"></stop>
      <stop offset="50%" stop-color="#818CF8"></stop>
      <stop offset="100%" stop-color="#A78BFA"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"></stop>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="18" fill="#0B1120" stroke="#1E293B"></rect>

  <!-- Header -->
  <text x="450" y="42" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#F8FAFC">
    EXPERIENCE / R&amp;D
  </text>

  <text x="450" y="66" text-anchor="middle" font-family="monospace" font-size="12" fill="#94A3B8">
    AI/ML • ENGINEERING • APPLIED RESEARCH
  </text>

  <!-- Main timeline -->
  <line x1="120" y1="125" x2="780" y2="125" stroke="#1E293B" stroke-width="4"></line>

  <line x1="120" y1="125" x2="780" y2="125" stroke="url(#line)" stroke-width="2" filter="url(#glow)">

    <animate attributeName="x1" values="120;780;120" dur="5s" repeatCount="indefinite"></animate>
  </line>

  <!-- 2025 node -->
  <circle cx="300" cy="125" r="10" fill="#0B1120" stroke="#38BDF8" stroke-width="3" filter="url(#glow)">
    <animate attributeName="r" values="8;13;8" dur="2s" repeatCount="indefinite"></animate>
  </circle>

  <text x="300" y="105" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#38BDF8">
    2025
  </text>

  <text x="300" y="153" text-anchor="middle" font-family="monospace" font-size="12" fill="#CBD5E1">
    CSIR–CEERI
  </text>

  <text x="300" y="170" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">
    AI/ML INTERN
  </text>

  <!-- 2026 node -->
  <circle cx="600" cy="125" r="10" fill="#0B1120" stroke="#A78BFA" stroke-width="3" filter="url(#glow)">
    <animate attributeName="r" values="8;13;8" dur="2s" begin="0.5s" repeatCount="indefinite"></animate>
  </circle>

  <text x="600" y="105" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#A78BFA">
    2026
  </text>

  <text x="600" y="153" text-anchor="middle" font-family="monospace" font-size="12" fill="#CBD5E1">
    DRDO
  </text>

  <text x="600" y="170" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">
    PROJECT TRAINEE
  </text>

  <!-- Animated scanning beam -->
  <rect x="100" y="193" width="120" height="2" fill="url(#scan)">

    <animate attributeName="x" values="100;680;100" dur="4s" repeatCount="indefinite"></animate>
  </rect>

  <!-- Status -->
  <text x="450" y="205" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569">
    RESEARCH → ENGINEERING → APPLICATION
  </text>

</svg>